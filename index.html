<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afya Shaikh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--red:#6F3DAD;--blue:#CDB0EA;--purple:#9A6AD0;--bg:#0e0c14;--text:#e8e4df;--muted:#8f8982;
  --bg-rgb:14,12,20;--text-rgb:232,228,223;
  --nav-bg:linear-gradient(to bottom,rgba(14,12,20,.97),transparent);
  --border-soft:rgba(255,255,255,.05);--border-softer:rgba(255,255,255,.04);--border-hover:rgba(255,255,255,.4);--border-faint:rgba(255,255,255,.08);--border-faintest:rgba(255,255,255,.15);
  --card-hover-bg:rgba(255,255,255,.02);
  --serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace;--sans:'Outfit',sans-serif;}
body.day-mode{--bg:#f8f5fb;--text:#0a0a0c;--muted:#4a4540;
  --bg-rgb:248,245,251;--text-rgb:10,10,12;
  --nav-bg:linear-gradient(to bottom,rgba(248,245,251,.97),transparent);
  --border-soft:rgba(0,0,0,.07);--border-softer:rgba(0,0,0,.05);--border-hover:rgba(0,0,0,.5);--border-faint:rgba(0,0,0,.1);--border-faintest:rgba(0,0,0,.2);
  --card-hover-bg:rgba(0,0,0,.025);}
body.day-mode .headshot-body p,body.day-mode .about-rest p,body.day-mode #nonprofits p,body.day-mode #volunteering p{color:rgba(var(--text-rgb),.98)!important;}
body.day-mode .edu-degree span,body.day-mode .talk-venue{color:rgba(var(--text-rgb),.75)!important;}
body.day-mode .hero-name .first{color:var(--text);}
body.day-mode .btn-white{background:linear-gradient(90deg,#6F3DAD,#9A6AD0,#CDB0EA);box-shadow:0 2px 8px rgba(111,61,173,.25);}
body.day-mode .btn-white span{background:none;-webkit-background-clip:initial;-webkit-text-fill-color:#fff;color:#fff;}
body.day-mode .btn-white:hover{box-shadow:0 8px 32px rgba(111,61,173,.4);}
body.day-mode .headshot{border-color:#1a1a1c;box-shadow:0 4px 24px rgba(0,0,0,.15);}
body.day-mode .hero-name .initial,body.day-mode .hero-name .last,
body.day-mode .about-headline em,body.day-mode .research-focus p em,
body.day-mode .pub-me,body.day-mode .pub-status span,body.day-mode .pub-section-head,
body.day-mode .talks-section-head,body.day-mode .mentorship-cta h3 em,
body.day-mode .writing-modal-title,body.day-mode .fg{
  background:linear-gradient(100deg,#6F3DAD 0%,#9A6AD0 55%,#CDB0EA 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
body.day-mode .btn-primary,body.day-mode #scroll-top{
  background:linear-gradient(90deg,#6F3DAD,#CDB0EA);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;background:var(--bg);}
body{background:var(--bg)!important;color:var(--text);font-family:var(--sans);font-weight:300;overflow-x:hidden;transition:background .4s ease,color .4s ease;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.28;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:flex-end;gap:2rem;padding:1.6rem 3rem;background:var(--nav-bg);transition:background .4s ease;}
.nav-links{display:flex;gap:2rem;list-style:none;}
.nav-links a{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:var(--muted);text-decoration:none;text-transform:uppercase;transition:color .3s;}
.nav-links a:hover{color:var(--text);}
.toggle-wrap{position:relative;display:flex;align-items:center;flex-shrink:0;}
.mode-toggle{background:none;border:1px solid var(--border-faint);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;padding:0;flex-shrink:0;}
.mode-toggle:hover{border-color:var(--border-hover);color:var(--text);}
.mode-toggle svg.moon,.mode-toggle svg.sun{width:14px;height:14px;}
.mode-toggle .sun{display:none;}
body.day-mode .mode-toggle .sun{display:block;}
body.day-mode .mode-toggle .moon{display:none;}
.toggle-hint{position:absolute;top:calc(100% + .3rem);right:0;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;opacity:0;animation:hintFadeIn .6s .8s forwards;transition:opacity .3s ease,transform .3s ease;}
.toggle-hint.dismissed{opacity:0!important;transform:translateY(-4px);animation:none;}
.toggle-hint-arrow{width:42px;height:34px;margin-right:.6rem;color:#fff;}
.toggle-hint-text{font-family:'Caveat',cursive;font-size:1.35rem;font-weight:500;color:#fff;white-space:nowrap;line-height:1;margin-top:.1rem;text-shadow:0 1px 3px rgba(0,0,0,.4);}
body.day-mode .toggle-hint-arrow{color:var(--text);}
body.day-mode .toggle-hint-text{color:var(--text);text-shadow:none;}
@keyframes hintFadeIn{0%{opacity:0;transform:translateY(-6px);}100%{opacity:1;transform:translateY(0);}}
@keyframes hintFadeOut{to{opacity:0;transform:translateY(-4px);}}
#hero{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);transition:background .4s ease;}
#hero::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .45s ease;
  background:radial-gradient(ellipse 52% 48% at 55% 38%,rgba(154,106,208,.18) 0%,rgba(205,176,234,.08) 45%,transparent 72%);}
body.day-mode #hero::before{opacity:1;}
@media(max-width:900px){
  #hero::before{background:radial-gradient(ellipse 70% 50% at 50% 36%,rgba(154,106,208,.16) 0%,rgba(205,176,234,.07) 48%,transparent 72%);}
}
@media(max-width:640px){
  #hero::before{background:radial-gradient(ellipse 90% 48% at 50% 32%,rgba(154,106,208,.14) 0%,rgba(205,176,234,.06) 50%,transparent 74%);}
}
#brain-canvas{position:absolute;inset:0;width:100%;height:100%;background:transparent;z-index:2;}
.hero-brain-space{flex:1;position:relative;z-index:3;}
.hero-bottom{position:relative;z-index:10;padding:0 3rem 3.5rem;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;}
.hero-name-block{pointer-events:none;}
.hero-eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:.8rem;opacity:0;animation:fadeUp 1s .4s forwards;}
.hero-name{font-family:var(--serif);font-size:clamp(2.8rem,6vw,5.8rem);font-weight:300;line-height:1.0;letter-spacing:-.01em;opacity:0;animation:fadeUp 1s .7s forwards;}
.hero-name .first{display:block;color:var(--text);}
.hero-name .initial{display:block;font-style:italic;font-size:.42em;letter-spacing:.12em;background:linear-gradient(100deg,#6F3DAD 0%,#8550BE 25%,#9A6AD0 50%,#B085DE 75%,#CDB0EA 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-name .last{display:block;background:linear-gradient(100deg,#6F3DAD 0%,#8550BE 25%,#9A6AD0 50%,#B085DE 75%,#CDB0EA 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-cta-block{display:flex;flex-direction:column;align-items:flex-end;gap:1rem;pointer-events:all;opacity:0;animation:fadeUp 1s 1.2s forwards;padding-bottom:.2rem;}
.hero-tagline{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;text-align:right;margin-bottom:.4rem;}
.hero-buttons{display:flex;gap:.8rem;}
.btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:.8rem 1.8rem;border-radius:2px;transition:all .3s;}
.btn-primary{background:linear-gradient(90deg,var(--red),var(--blue));color:#fff;}
.btn-primary:hover{opacity:.85;transform:translateY(-1px);box-shadow:0 8px 32px rgba(111,61,173,.3);}
.btn-ghost{border:1px solid var(--border-faintest);color:var(--muted);}
.btn-ghost:hover{border-color:var(--border-hover);color:var(--text);}
.btn-white{background:#fff;border-radius:2px;padding:.8rem 1.8rem;text-decoration:none;transition:all .3s;}
.btn-white span{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(90deg,#6F3DAD,#9A6AD0,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.btn-white:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(255,255,255,.18);}
.scroll-hint{position:absolute;bottom:2rem;left:0;right:0;margin:0 auto;width:max-content;display:flex;flex-direction:column;align-items:center;gap:.4rem;opacity:0;animation:scrollHintIn 1s 1.8s forwards;z-index:10;pointer-events:none;}
.scroll-hint span{font-family:var(--mono);font-size:.58rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;padding-left:.25em;/* optical center for letter-spacing */}
.scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,var(--red),transparent);animation:scrollPulse 2s ease-in-out infinite;}
@keyframes scrollHintIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
section{max-width:1100px;margin:0 auto;padding:6rem 3rem;}
.divider{max-width:1100px;margin:0 auto;height:1px;background:linear-gradient(to right,transparent,rgba(111,61,173,.2),rgba(205,176,234,.2),transparent);}
.section-label{font-family:var(--mono);font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:3rem;display:flex;align-items:center;gap:1rem;}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(111,61,173,.3),transparent);max-width:160px;}
#about{display:block;}
.about-headline{font-family:var(--serif);font-size:clamp(1.9rem,3.2vw,2.7rem);font-weight:300;line-height:1.2;margin-bottom:2.4rem;}
.about-headline em{font-style:italic;background:linear-gradient(90deg,var(--red),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.headshot-row{display:flex;align-items:flex-start;gap:2.4rem;margin-bottom:2.4rem;}
.headshot{width:178px;height:178px;border-radius:50%;flex-shrink:0;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.headshot img{width:100%;height:100%;object-fit:cover;object-position:center 18%;border-radius:50%;}
.headshot-body{flex:1;}
.headshot-body p{font-size:.95rem;line-height:1.85;color:rgba(var(--text-rgb),.75);margin-bottom:1.1rem;max-width:640px;}
.about-rest p{font-size:.95rem;line-height:1.85;color:rgba(var(--text-rgb),.75);margin-bottom:1.1rem;max-width:640px;}
.about-tags{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem;}
.tag{font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:.4rem .9rem;border:1px solid var(--border-faint);border-radius:100px;color:var(--muted);transition:all .3s;}
.tag:hover{border-color:var(--red);color:var(--red);}
.edu-track{position:relative;padding-left:2.8rem;display:flex;flex-direction:column;gap:0;}
.edu-track::before{content:'';position:absolute;left:.65rem;top:.7rem;bottom:.7rem;width:1px;background:linear-gradient(to bottom,var(--red),var(--purple),var(--blue));}
.edu-node{position:relative;padding-bottom:2.4rem;}
.edu-node:last-child{padding-bottom:0;}
.edu-dot{position:absolute;left:-2.15rem;top:.45rem;width:13px;height:13px;border-radius:50%;border:2px solid;background:var(--bg);z-index:1;}
.edu-dot.incoming{border-color:var(--red);box-shadow:0 0 8px rgba(111,61,173,.5);}
.edu-dot.current{border-color:var(--purple);box-shadow:0 0 8px rgba(154,106,208,.5);}
.edu-dot.past{border-color:var(--blue);}
.edu-year{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:.35rem;}
.edu-school{font-family:var(--serif);font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:.2rem;}
.edu-degree{font-size:.92rem;color:rgba(var(--text-rgb),.88);line-height:1.55;}
.edu-badge{display:inline-block;margin-top:.5rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;padding:.25rem .65rem;border-radius:2px;background:linear-gradient(90deg,rgba(111,61,173,.1),rgba(205,176,234,.1));border:1px solid rgba(111,61,173,.2);color:var(--red);}
.research-focus{margin-bottom:2.4rem;padding:2.2rem 2.5rem;border:1px solid rgba(111,61,173,.18);background:linear-gradient(135deg,rgba(111,61,173,.05),rgba(154,106,208,.04),rgba(205,176,234,.05));border-radius:2px;position:relative;overflow:hidden;}
.research-focus::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);}
.research-focus-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin-bottom:1rem;opacity:.85;}
.research-focus p{font-family:var(--serif);font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:300;line-height:1.55;color:var(--text);max-width:820px;}
.research-focus p em{font-style:italic;background:linear-gradient(90deg,var(--red),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.research-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5px;background:var(--border-softer);border:1px solid var(--border-softer);}
.research-card{background:var(--bg);padding:2.5rem;transition:background .3s;position:relative;overflow:hidden;cursor:default;}
.research-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .4s ease;}
.research-card:hover::before{transform:scaleX(1);}.research-card:hover{background:var(--card-hover-bg);}
.card-number{font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;color:var(--red);margin-bottom:1.2rem;opacity:.7;}
.card-title{font-family:var(--serif);font-size:1.35rem;font-weight:400;line-height:1.25;margin-bottom:.8rem;}
.card-body{font-size:.85rem;line-height:1.8;color:var(--muted);}
.card-advisor{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:rgba(var(--text-rgb),.38);margin-top:.9rem;text-transform:uppercase;}
.card-advisor span{color:rgba(var(--text-rgb),.62);}
.card-tag{display:inline-block;margin-top:1rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:.3rem .8rem;background:linear-gradient(90deg,rgba(111,61,173,.1),rgba(205,176,234,.1));border:1px solid rgba(111,61,173,.2);color:var(--red);border-radius:2px;}
.pub-list{display:flex;flex-direction:column;gap:0;}
.pub-item{padding:1.5rem 0;border-bottom:1px solid var(--border-soft);display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start;}
.pub-item:last-child{border-bottom:none;}
.pub-title{font-family:var(--serif);font-size:1.05rem;font-weight:400;line-height:1.4;margin-bottom:.4rem;}
.pub-title a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(111,61,173,.2);transition:border-color .3s;}
.pub-title a:hover{border-color:var(--red);}
.pub-authors{font-size:.8rem;color:var(--muted);line-height:1.6;}
.pub-me{font-weight:400;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline;}
.pub-journal{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);white-space:nowrap;margin-top:.2rem;text-align:right;}
.pub-year{font-family:var(--mono);font-size:.58rem;color:var(--muted);text-align:right;}
.pub-status{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;margin-top:.2rem;text-align:right;padding:.25rem .65rem;border-radius:2px;background:linear-gradient(90deg,rgba(111,61,173,.1),rgba(154,106,208,.1),rgba(205,176,234,.1));border:1px solid rgba(154,106,208,.25);background-clip:padding-box;display:inline-block;}
.pub-status span{background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.pub-section-head{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;margin:2.4rem 0 1rem;display:flex;align-items:center;gap:1rem;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.pub-section-head::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(154,106,208,.3),transparent);}
.pub-section-head.first{margin-top:0;}
.pub-item.in-prep .pub-title{color:rgba(var(--text-rgb),.88);}
.pub-item.in-prep .pub-title-plain{font-family:var(--serif);font-size:1.05rem;font-weight:400;line-height:1.4;margin-bottom:.4rem;color:rgba(var(--text-rgb),.88);}
.oeuvre-open{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%;}
.oeuvre-open .pub-title{border-bottom:1px solid rgba(111,61,173,.2);display:inline;transition:border-color .3s;}
.oeuvre-open:hover .pub-title{border-color:var(--red);}
.oeuvre-hint{font-family:var(--mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);opacity:.75;margin-top:.45rem;}
.writing-modal{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));
  background:rgba(var(--bg-rgb),.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;}
.writing-modal.open{opacity:1;visibility:visible;}
.writing-modal-card{position:relative;width:min(560px,100%);max-height:min(84vh,820px);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);border-radius:4px;border:1px solid var(--border-soft);
  box-shadow:0 24px 80px rgba(0,0,0,.35);
  transform:translateY(14px) scale(.98);transition:transform .35s cubic-bezier(.2,.7,.2,1),background .4s ease,color .4s ease,border-color .4s ease;}
body.day-mode .writing-modal-card{box-shadow:0 20px 60px rgba(0,0,0,.12);}
.writing-modal.open .writing-modal-card{transform:translateY(0) scale(1);}
.writing-modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);}
.writing-modal-close{position:absolute;top:.85rem;right:.85rem;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--border-faint);
  background:var(--bg);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.writing-modal-close:hover{border-color:var(--border-hover);color:var(--text);}
.writing-modal-close svg{width:14px;height:14px;}
.writing-modal-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2rem 1.6rem 2.2rem;overscroll-behavior:contain;}
.writing-modal-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin-bottom:.85rem;}
.writing-modal-title{font-family:var(--serif);font-weight:300;font-size:clamp(1.55rem,5vw,2.05rem);line-height:1.2;margin-bottom:1.35rem;padding-right:2.4rem;
  background:linear-gradient(100deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.writing-modal-body{font-family:var(--sans);font-weight:300;font-size:.98rem;line-height:1.85;color:rgba(var(--text-rgb),.78);}
.writing-modal-body p{margin-bottom:1.15rem;}
.writing-modal-body p:last-child{margin-bottom:0;}
@media(max-width:560px){
  .writing-modal{padding:max(.75rem,env(safe-area-inset-top)) .75rem max(.75rem,env(safe-area-inset-bottom));align-items:flex-end;}
  .writing-modal-card{width:100%;max-height:min(90vh,920px);border-radius:4px;}
  .writing-modal-scroll{padding:1.6rem 1.25rem 2rem;}
  .writing-modal-close{top:.7rem;right:.7rem;}
}

.talks-section-head{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;margin:2.4rem 0 1rem;display:flex;align-items:center;gap:1rem;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.talk-list{display:flex;flex-direction:column;gap:1.2rem;}
.talk-item{padding:1.4rem 1.6rem;border:1px solid var(--border-soft);border-left:2px solid;border-radius:2px;transition:background .3s;}

.talk-title{font-family:var(--serif);font-size:1.05rem;font-weight:400;line-height:1.35;margin-bottom:.3rem;}

.awards-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5px;background:var(--border-softer);border:1px solid var(--border-softer);}
.award-card{background:var(--bg);padding:2rem 1.8rem;position:relative;overflow:hidden;transition:background .3s;}
.award-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.award-card:hover::before{transform:scaleX(1);}.award-card:hover{background:var(--card-hover-bg);}
.award-year{font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;color:var(--red);opacity:.7;margin-bottom:.6rem;text-transform:uppercase;}
.award-title{font-family:var(--serif);font-size:1.1rem;font-weight:400;line-height:1.3;margin-bottom:.5rem;}
.award-body{font-size:.8rem;line-height:1.75;color:var(--muted);}
.mentorship-wrap{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
.mentorship-cta{padding:2.2rem;border:1px solid rgba(111,61,173,.15);background:linear-gradient(135deg,rgba(111,61,173,.04),rgba(205,176,234,.04));border-radius:2px;}
.mentorship-cta h3{font-family:var(--serif);font-size:1.6rem;font-weight:300;margin-bottom:1.1rem;color:var(--text);}
.mentorship-cta h3 em{font-style:italic;background:linear-gradient(90deg,#6F3DAD,#8550BE,#9A6AD0,#B085DE,#CDB0EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.mentorship-cta .cta-link{font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);text-decoration:none;border-bottom:1px solid rgba(111,61,173,.3);padding-bottom:2px;transition:all .3s;display:inline-block;margin-top:.4rem;}
.mentorship-cta .cta-link:hover{border-color:var(--red);}
footer{border-top:1px solid var(--border-softer);padding:2rem 3rem;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;}
footer p{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.fg{background:linear-gradient(90deg,var(--red),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* Artwork gallery */
#artwork{max-width:1100px;}
.art-intro{font-family:var(--serif);font-size:clamp(1.15rem,2vw,1.4rem);font-weight:300;line-height:1.55;color:rgba(var(--text-rgb),.78);max-width:36ch;margin:-1.2rem 0 2.8rem;}
.art-gallery{column-count:3;column-gap:1rem;}
.art-item{position:relative;overflow:hidden;border-radius:2px;background:rgba(var(--text-rgb),.04);cursor:zoom-in;isolation:isolate;min-height:0;border:0;padding:0;font:inherit;color:inherit;text-align:left;display:inline-block;width:100%;margin:0 0 1rem;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;}
.art-item::after{content:'';position:absolute;inset:0;border:1px solid transparent;border-image:linear-gradient(135deg,rgba(111,61,173,.0),rgba(154,106,208,.0),rgba(205,176,234,.0)) 1;transition:border-image .4s ease;pointer-events:none;}
.art-item:hover::after{border-image:linear-gradient(135deg,rgba(111,61,173,.55),rgba(154,106,208,.45),rgba(205,176,234,.55)) 1;}
.art-item img{width:100%;height:auto;object-fit:contain;object-position:center;display:block;vertical-align:top;transition:filter .5s ease;}
.art-item:hover img{filter:saturate(1.06) contrast(1.02);}
.art-item.feature,.art-item.tall{min-height:0;grid-column:auto;grid-row:auto;}
.art-item .art-meta{position:absolute;left:0;right:0;bottom:0;padding:2.4rem 1.1rem .95rem;background:linear-gradient(to top,rgba(6,6,8,.72),transparent);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;pointer-events:none;}

.art-item:hover .art-meta{opacity:1;transform:translateY(0);}
.art-meta span{font-family:var(--mono);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#fff;}
.art-lightbox{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:2.5rem;background:rgba(6,6,8,.88);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease;}
.art-lightbox.open{opacity:1;visibility:visible;}
body.day-mode .art-lightbox{background:rgba(247,245,241,.92);}
.art-lightbox-inner{position:relative;max-width:min(1080px,92vw);max-height:88vh;opacity:0;transform:scale(.97) translateY(10px);transition:opacity .4s ease,transform .4s ease;}
.art-lightbox.open .art-lightbox-inner{opacity:1;transform:scale(1) translateY(0);}
.art-lightbox img{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;margin:0 auto;box-shadow:0 24px 80px rgba(0,0,0,.45);border-radius:2px;}
.art-lightbox-caption{margin-top:1rem;text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.art-lightbox-close,.art-lightbox-nav{position:absolute;background:none;border:1px solid var(--border-faint);color:var(--muted);cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;}
.art-lightbox-close{top:-.2rem;right:-.2rem;width:40px;height:40px;border-radius:50%;transform:translate(40%,-40%);}
.art-lightbox-close:hover,.art-lightbox-nav:hover{border-color:var(--border-hover);color:var(--text);}
.art-lightbox-nav{top:50%;width:44px;height:44px;border-radius:50%;transform:translateY(-50%);}
.art-lightbox-prev{left:1.2rem;}
.art-lightbox-next{right:1.2rem;}
.art-lightbox-nav svg,.art-lightbox-close svg{width:16px;height:16px;}
@media(max-width:900px){
  .art-gallery{column-count:2;column-gap:.75rem;}
  .art-item{margin-bottom:.75rem;}
  .art-lightbox-prev{left:.6rem;}.art-lightbox-next{right:.6rem;}

}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

    for(var p=pulses.length-1;p>=0;p--){
      var pu=pulses[p];pu.t+=0.016*pu.sp;
      if(pu.t>=1){pulses.splice(p,1);continue;}
      var pi2=pu.pi;
      var fadeP=pu.t<0.15?pu.t/0.15:(pu.t>0.75?(1-pu.t)/0.25:1);
      var bo=fadeP;
      {
        plc[pi2*6]=plb[pi2*6]*bo;plc[pi2*6+1]=plb[pi2*6+1]*bo;plc[pi2*6+2]=plb[pi2*6+2]*bo;
        plc[pi2*6+3]=plb[pi2*6+3]*bo;plc[pi2*6+4]=plb[pi2*6+4]*bo;plc[pi2*6+5]=plb[pi2*6+5]*bo;
      }
      if(di<MP){
        var va2=NV[pu.ni],vb2=NV[pu.nj];
        dp[di*3]=va2[0]+(vb2[0]-va2[0])*pu.t;dp[di*3+1]=va2[1]+(vb2[1]-va2[1])*pu.t;dp[di*3+2]=va2[2]+(vb2[2]-va2[2])*pu.t;
        var br2=dayMode?2.0:2.4;
        dc[di*3]=Math.min(1,pu.col.r*fadeP*br2);dc[di*3+1]=Math.min(1,pu.col.g*fadeP*br2);dc[di*3+2]=Math.min(1,pu.col.b*fadeP*br2);
        di++;
      }
    }
    plCA.needsUpdate=true;dPA2.needsUpdate=true;dCA2.needsUpdate=true;dGeo.setDrawRange(0,di);
    renderer.render(scene,camera);
  }
  animate();
})();

<script>
(function(){
  var t=document.getElementById('mode-toggle');
  var hint=document.getElementById('toggle-hint');
  if(!t)return;
  var clickedAway=false;
  function setHidden(hidden){
    if(!hint||clickedAway)return;
    if(hidden){hint.classList.add('dismissed');}
    else{hint.classList.remove('dismissed');}
  }
  function permanentDismiss(){
    if(!hint||clickedAway)return;
    clickedAway=true;
    hint.classList.add('dismissed');
    setTimeout(function(){if(hint)hint.style.display='none';},350);
  }
  t.addEventListener('click',function(){
    document.body.classList.toggle('day-mode');
    var isDay=document.body.classList.contains('day-mode');
    if(window.__setBrainMode)window.__setBrainMode(isDay?'day':'night');
    permanentDismiss();
  });
  window.addEventListener('scroll',function(){
    setHidden(window.scrollY>700);
  },{passive:true});
})();
</script>
<script>
(function(){
  var items=[].slice.call(document.querySelectorAll('.art-item'));
  if(!items.length)return;
  var lb=document.getElementById('art-lightbox');
  var img=document.getElementById('art-lightbox-img');
  var cap=document.getElementById('art-lightbox-caption');
  var idx=0;
  function openAt(i){
    idx=(i+items.length)%items.length;
    var el=items[idx];
    var thumb=el.querySelector('img');
    var meta=el.querySelector('.art-meta span');
    img.src=thumb.src;img.alt=thumb.alt;
    cap.textContent=meta?meta.textContent.trim():'';
    lb.hidden=false;
    requestAnimationFrame(function(){lb.classList.add('open');});
    document.body.style.overflow='hidden';
  }
  function close(){
    lb.classList.remove('open');
    document.body.style.overflow='';
    setTimeout(function(){if(!lb.classList.contains('open'))lb.hidden=true;},350);
  }
  items.forEach(function(el){
    el.addEventListener('click',function(){openAt(+el.getAttribute('data-art'));});
  });
  document.getElementById('art-close').addEventListener('click',close);
  document.getElementById('art-prev').addEventListener('click',function(e){e.stopPropagation();openAt(idx-1);});
  document.getElementById('art-next').addEventListener('click',function(e){e.stopPropagation();openAt(idx+1);});
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();
    if(e.key==='ArrowLeft')openAt(idx-1);
    if(e.key==='ArrowRight')openAt(idx+1);
  });
})();
</script>


<script>
(function(){
  var fine=window.matchMedia('(hover:hover) and (pointer:fine)');
  var cur=document.getElementById('heart-cursor');
  if(!cur)return;
  function onMove(e){
    cur.style.left=e.clientX+'px';
    cur.style.top=e.clientY+'px';
    cur.style.opacity='1';
  }
  function onOver(e){
    var t=e.target&&e.target.closest&&e.target.closest('a,button,[role="button"],.art-item,.oeuvre-open,input,textarea,select,label,#scroll-top');
    cur.classList.toggle('is-clickable',!!t);
  }
  function enable(){
    if(!fine.matches)return;
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseover',onOver);
    document.addEventListener('mousedown',function(){cur.classList.add('is-pressed');});
    document.addEventListener('mouseup',function(){cur.classList.remove('is-pressed');});
    document.documentElement.addEventListener('mouseleave',function(){cur.style.opacity='0';});
  }
  enable();
})();
</script>
