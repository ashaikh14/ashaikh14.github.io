<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Afya Shaikh</title>
<link rel="icon" href="logo-heart.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#552586;--blue:#B589D6;--purple:#804FB3;
  --bg:#060608;--text:#e8e4df;--muted:#7a7570;
  --bg-rgb:6,6,8;--text-rgb:232,228,223;
  --border-faint:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.4);--border-faintest:rgba(255,255,255,.15);
  --serif:'Cormorant Garamond',Georgia,serif;
  --mono:'DM Mono',monospace;
  --sans:'Outfit',sans-serif;
}
body.day-mode{
  --bg:#f7f5f1;--text:#0a0a0c;--muted:#4a4540;
  --bg-rgb:247,245,241;--text-rgb:10,10,12;
  --border-faint:rgba(0,0,0,.1);--border-hover:rgba(0,0,0,.5);--border-faintest:rgba(0,0,0,.2);
}
body.day-mode .btn-home{
  background:linear-gradient(90deg,#552586,#6A359C,#804FB3,#9969C7,#B589D6);
  box-shadow:0 2px 8px rgba(85,37,134,.2);
}
body.day-mode .btn-home span{
  background:none;-webkit-background-clip:initial;-webkit-text-fill-color:#fff;color:#fff;
}
body.day-mode .btn-home:hover{box-shadow:0 8px 32px rgba(85,37,134,.35);}
body.day-mode .brand,body.day-mode .code,body.day-mode .title,body.day-mode .btn-home span{
  background:linear-gradient(100deg,#552586 0%,#6A359C 25%,#804FB3 50%,#9969C7 75%,#B589D6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
body.day-mode .btn-home span{background:none;-webkit-background-clip:initial;-webkit-text-fill-color:#fff;color:#fff;}
body.day-mode .logo-mark{
  filter:drop-shadow(0 12px 40px rgba(128,79,179,.18));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{background:var(--bg);}
body{
  background:var(--bg)!important;color:var(--text);
  font-family:var(--sans);font-weight:300;
  overflow:hidden;transition:background .4s ease,color .4s ease;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.45;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
}

/* Atmosphere */
.glow{
  position:fixed;border-radius:50%;pointer-events:none;filter:blur(90px);z-index:0;
  transition:opacity .5s ease;
}
.glow-a{
  width:min(55vw,520px);height:min(55vw,520px);
  top:-12%;left:50%;transform:translateX(-58%);
  background:radial-gradient(circle,rgba(85,37,134,.28),transparent 68%);
  animation:driftA 14s ease-in-out infinite;
}
.glow-b{
  width:min(50vw,460px);height:min(50vw,460px);
  bottom:-18%;right:8%;
  background:radial-gradient(circle,rgba(181,137,214,.22),transparent 68%);
  animation:driftB 18s ease-in-out infinite;
}
.glow-c{
  width:min(40vw,360px);height:min(40vw,360px);
  top:42%;left:6%;
  background:radial-gradient(circle,rgba(128,79,179,.2),transparent 70%);
  animation:driftC 16s ease-in-out infinite;
}
body.day-mode .glow-a{background:radial-gradient(circle,rgba(85,37,134,.14),transparent 68%);}
body.day-mode .glow-b{background:radial-gradient(circle,rgba(181,137,214,.1),transparent 68%);}
body.day-mode .glow-c{background:radial-gradient(circle,rgba(128,79,179,.1),transparent 70%);}

nav{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.6rem 3rem;
  background:linear-gradient(to bottom,rgba(var(--bg-rgb),.97),transparent);
  transition:background .4s ease;
}
.brand{
  font-family:var(--serif);font-size:1.35rem;font-weight:300;
  text-decoration:none;letter-spacing:.01em;line-height:1;
  background:linear-gradient(100deg,#552586,#6A359C,#804FB3,#9969C7,#B589D6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.mode-toggle{
  background:none;border:1px solid var(--border-faint);color:var(--muted);
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s;padding:0;
}
.mode-toggle:hover{border-color:var(--border-hover);color:var(--text);}
.mode-toggle svg{width:14px;height:14px;}
.mode-toggle .sun{display:none;}
body.day-mode .mode-toggle .sun{display:block;}
body.day-mode .mode-toggle .moon{display:none;}

main{
  position:relative;z-index:10;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:6rem 1.5rem 4rem;
}

.logo-wrap{
  position:relative;margin-bottom:2.2rem;
  opacity:0;animation:fadeUp .9s .15s forwards;
}
.logo-mark{
  width:clamp(120px,22vw,180px);height:auto;display:block;
  animation:float 5.5s ease-in-out infinite;
  filter:drop-shadow(0 16px 48px rgba(85,37,134,.22));
}
.yarn-trail{
  position:absolute;left:50%;bottom:-6px;
  width:120px;height:70px;pointer-events:none;
  transform:translateX(28%);
  overflow:visible;
}
.yarn-trail path{
  fill:none;stroke:url(#yarnGrad);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:180;stroke-dashoffset:180;
  animation:drawYarn 2.2s .6s ease forwards, yarnWaver 4s 2.6s ease-in-out infinite;
}

.code{
  font-family:var(--mono);font-size:.65rem;letter-spacing:.32em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:.9rem;
  opacity:0;animation:fadeUp .9s .35s forwards;
}
.code span{
  background:linear-gradient(90deg,#552586,#6A359C,#804FB3,#9969C7,#B589D6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

h1{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(4.5rem,16vw,9.5rem);line-height:.9;
  letter-spacing:-.03em;margin-bottom:1.1rem;
  background:linear-gradient(100deg,#552586 0%,#6A359C 25%,#804FB3 50%,#9969C7 75%,#B589D6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  opacity:0;animation:fadeUp 1s .5s forwards;
}

.headline{
  font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:clamp(1.35rem,3vw,1.85rem);line-height:1.35;
  color:var(--text);margin-bottom:.7rem;max-width:22ch;
  opacity:0;animation:fadeUp 1s .7s forwards;
}

.sub{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);
  max-width:36ch;line-height:1.9;margin-bottom:2.4rem;
  opacity:0;animation:fadeUp 1s .9s forwards;
}

.actions{
  display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;
  opacity:0;animation:fadeUp 1s 1.1s forwards;
}

.btn{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;
  text-transform:uppercase;text-decoration:none;
  padding:.85rem 1.9rem;border-radius:2px;transition:all .3s;
  display:inline-block;
}
.btn-home{
  background:#fff;
}
.btn-home span{
  background:linear-gradient(90deg,#552586,#6A359C,#804FB3,#9969C7,#B589D6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.btn-home:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(255,255,255,.18);}
.btn-ghost{
  border:1px solid var(--border-faintest);color:var(--muted);
}
.btn-ghost:hover{border-color:var(--border-hover);color:var(--text);}

.footer-note{
  position:fixed;bottom:1.6rem;left:0;right:0;z-index:20;
  text-align:center;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);
  opacity:0;animation:fadeUp 1s 1.4s forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-1.5deg);}
  50%{transform:translateY(-12px) rotate(1.5deg);}
}
@keyframes drawYarn{
  to{stroke-dashoffset:0;}
}
@keyframes yarnWaver{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(3px);}
}
@keyframes driftA{
  0%,100%{transform:translateX(-58%) translateY(0);}
  50%{transform:translateX(-48%) translateY(18px);}
}
@keyframes driftB{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(-24px,-16px);}
}
@keyframes driftC{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(20px,12px);}
}

@media(max-width:768px){
  nav{padding:1.2rem 1.5rem;}
  .logo-mark{width:110px;}
  .yarn-trail{width:90px;height:54px;transform:translateX(22%);}
  .actions{flex-direction:column;align-items:center;}
  body{overflow-y:auto;}
}
@media(prefers-reduced-motion:reduce){
  .logo-mark,.glow,.yarn-trail path{animation:none;}
  .logo-wrap,.code,h1,.headline,.sub,.actions,.footer-note{
    opacity:1;animation:none;
  }
  .yarn-trail path{stroke-dashoffset:0;}
}
</style>
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>
<div class="glow glow-c" aria-hidden="true"></div>

<nav>
  <a class="brand" href="index.html">Afya Shaikh</a>
  <button class="mode-toggle" id="mode-toggle" aria-label="Toggle day/night mode" title="Toggle day/night mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</nav>

<main>
  <div class="logo-wrap">
    <img class="logo-mark" src="logo-heart.png" alt="Afya Shaikh — yarn heart logo" width="180" height="180">
    <svg class="yarn-trail" viewBox="0 0 120 70" aria-hidden="true">
      <defs>
        <linearGradient id="yarnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#552586"/>
          <stop offset="50%" stop-color="#804FB3"/>
          <stop offset="100%" stop-color="#B589D6"/>
        </linearGradient>
      </defs>
      <path d="M8 8 C 28 22, 36 48, 58 42 C 82 35, 92 18, 112 28"/>
    </svg>
  </div>

  <p class="code"><span>Error</span> · Page not found</p>
  <h1>404</h1>
  <p class="headline">This page came unraveled.</p>
  <p class="sub">The thread you followed doesn’t lead anywhere — let’s stitch you back home.</p>

  <div class="actions">
    <a class="btn btn-home" href="index.html"><span>Return Home</span></a>
  </div>
</main>

<p class="footer-note">Afya Shaikh</p>

<script>
(function(){
  var toggle=document.getElementById('mode-toggle');
  var saved=localStorage.getItem('afya-mode');
  if(saved==='day')document.body.classList.add('day-mode');
  toggle.addEventListener('click',function(){
    document.body.classList.toggle('day-mode');
    localStorage.setItem('afya-mode',document.body.classList.contains('day-mode')?'day':'night');
  });
})();
</script>
</body>
</html>
